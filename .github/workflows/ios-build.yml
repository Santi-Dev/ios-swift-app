name: iOS Swift App Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permitir ejecución manual desde Windows Builder

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        
      - name: Configurar entorno Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
          
      - name: Compilar aplicación (xcodebuild)
        run: |
          xcodebuild clean build -scheme "iOSSwiftWindowsApp" -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build
          
      - name: Empaquetar artefacto en .ipa
        run: |
          mkdir -p Payload
          mv build/*.app Payload/
          zip -r App.ipa Payload
          
      - name: Subir binario .ipa para descarga en Windows
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App
          path: App.ipa
